<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wello Partners - Stripe Refresh</title>
    <link rel="stylesheet" href="/styles.css?v=20260227c" />
  </head>
  <body>
    <div class="page">
      <div class="container">
        <nav class="nav">
          <a class="brand" href="/">
            <img src="/assets/wello-logo.jpeg" alt="Wello logo" />
            <span>Wello Partners</span>
          </a>
          <div class="nav-actions">
            <a class="button secondary" href="mailto:wellopartners@gmail.com">Support</a>
          </div>
        </nav>

        <div class="card-simple">
          <span class="pill">Stripe payments</span>
          <h2>Reopening Wello...</h2>
          <p>
            Your Stripe payment setup session expired or was interrupted. Return
            to the Wello app to continue payment method setup.
          </p>
          <div class="cta-row" style="justify-content:center;">
            <a id="open-app-btn" class="button primary" href="wello://auth/callback?flow=stripe_refresh">Open Wello app</a>
            <a class="button secondary" href="mailto:wellopartners@gmail.com">Contact support</a>
          </div>
          <p id="fallback-note" class="notice" hidden>
            If the app did not open, tap "Open Wello app" above.
          </p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var deepLink = "wello://auth/callback?flow=stripe_refresh";
        var fallbackNote = document.getElementById("fallback-note");
        function openApp() {
          window.location.replace(deepLink);
        }
        setTimeout(openApp, 120);
        setTimeout(function () {
          if (fallbackNote) fallbackNote.hidden = false;
        }, 1600);
      })();
    </script>
  </body>
</html>
