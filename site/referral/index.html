<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wello Partners | Referral</title>
    <meta
      name="description"
      content="Open your Wello referral link in the app to claim your referral reward."
    />
    <link rel="icon" type="image/png" href="/assets/wello-mark.png" />
    <link rel="apple-touch-icon" href="/assets/wello-mark.png" />
    <link rel="stylesheet" href="/styles.css?v=20260227c" />
  </head>
  <body class="referral-v2">
    <div class="v2-shell">
      <header class="v2-nav-wrap">
        <div class="v2-container">
          <nav class="v2-nav" aria-label="Referral navigation">
            <a class="v2-brand" href="/" aria-label="Wello Partners home">
              <img src="/assets/wello-mark.png" alt="Wello logo" />
              <span>Wello Partners</span>
            </a>
            <a class="v2-nav-cta" href="mailto:support@wellopartners.com">Support</a>
          </nav>
        </div>
      </header>

      <main class="v2-referral-main">
        <section class="v2-referral-card">
          <p class="v2-kicker">Referral</p>
          <h1>Open Wello</h1>
          <p>We detected a referral link. Open the app to continue.</p>
          <div class="v2-actions">
            <a id="open-app-btn" class="v2-btn v2-btn-primary" href="wello://auth/callback?flow=referral">
              Open Wello app
            </a>
            <a id="open-store-btn" class="v2-btn v2-btn-secondary" href="#">
              Download app
            </a>
            <a class="v2-btn v2-btn-secondary" href="mailto:support@wellopartners.com">
              Contact support
            </a>
          </div>
          <p id="fallback-note" class="v2-referral-note" hidden>
            If the app did not open, we'll take you to the download page.
          </p>
        </section>
      </main>

      <footer class="v2-footer">
        <div class="v2-container v2-footer-row">
          <span>&copy; <span id="year"></span> Wello Partners LLC</span>
          <div class="v2-footer-links">
            <a href="/privacy">Privacy</a>
            <a href="/terms">Terms</a>
            <a href="/third-party-notices">Third-Party Notices</a>
          </div>
        </div>
      </footer>
    </div>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      (function () {
        var params = new URLSearchParams(window.location.search || "");
        var rawRef = String(params.get("ref") || "")
          .trim()
          .replace(/\s+/g, "")
          .toUpperCase();
        var isValidRef = /^[A-Z0-9]{6,32}$/.test(rawRef);
        var deepLink = isValidRef
          ? "wello://auth/callback?flow=referral&ref=" + encodeURIComponent(rawRef)
          : "wello://auth/callback?flow=referral";
        var IOS_APP_STORE_URL = "https://apps.apple.com/us/app/id6759310025";
        var ANDROID_PLAY_STORE_URL =
          "https://play.google.com/store/apps/details?id=com.wellopartners.wello";
        var FALLBACK_WEB_URL = "https://www.wellopartners.com/contact";
        var fallbackNote = document.getElementById("fallback-note");
        var openAppBtn = document.getElementById("open-app-btn");
        var openStoreBtn = document.getElementById("open-store-btn");
        var platform = (function () {
          var ua = navigator.userAgent || "";
          if (/android/i.test(ua)) return "android";
          if (/iphone|ipad|ipod/i.test(ua)) return "ios";
          return "other";
        })();
        var storeUrl =
          platform === "android"
            ? ANDROID_PLAY_STORE_URL
            : platform === "ios"
              ? IOS_APP_STORE_URL
              : FALLBACK_WEB_URL;
        if (openAppBtn) {
          openAppBtn.setAttribute("href", deepLink);
        }
        if (openStoreBtn) {
          openStoreBtn.setAttribute("href", storeUrl);
        }

        var fallbackTimer = null;
        var hasNavigatedToStore = false;
        function openStore() {
          if (hasNavigatedToStore) return;
          hasNavigatedToStore = true;
          window.location.href = storeUrl;
        }

        document.addEventListener("visibilitychange", function () {
          if (document.hidden && fallbackTimer) {
            clearTimeout(fallbackTimer);
            fallbackTimer = null;
          }
        });

        function openApp() {
          window.location.href = deepLink;
        }
        setTimeout(openApp, 120);
        fallbackTimer = setTimeout(function () {
          openStore();
        }, 1300);
        setTimeout(function () {
          if (fallbackNote) fallbackNote.hidden = false;
        }, 1600);
      })();
    </script>
  </body>
</html>
