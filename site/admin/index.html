<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wello Admin Panel</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script>
      (() => {
        const storageKey = "wello-admin-theme";
        const saved = localStorage.getItem(storageKey);
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved === "dark" || saved === "light" ? saved : (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260227a" />
    <link rel="stylesheet" href="/admin/admin-panel.css?v=20260227a" />
  </head>
  <body class="admin">
    <div class="admin-root">
      <header class="admin-topbar">
        <a class="brand" href="/">
          <img src="/assets/wello-logo.jpeg" alt="Wello logo" />
          <span>Wello Admin</span>
        </a>
        <div class="topbar-actions">
          <div class="identity-chip">
            <span id="admin-user">Not signed in</span>
            <span class="dot">•</span>
            <span id="admin-role">--</span>
          </div>
          <button id="admin-theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
            <span id="admin-theme-toggle-text">Dark mode</span>
          </button>
          <button class="button secondary" id="refresh-session">Refresh session</button>
          <button class="button secondary" id="sign-out">Sign out</button>
        </div>
      </header>

      <main class="admin-main">
        <section id="auth-panel" class="card-simple admin-auth">
          <span class="pill">Secure staff access</span>
          <h2>Admin panel sign in</h2>
          <p>Sign in with your admin or supervisor account.</p>
          <div class="form-grid">
            <label class="field">
              <span>Email</span>
              <input id="auth-email" type="email" autocomplete="email" />
            </label>
            <label class="field">
              <span>Password</span>
              <input id="auth-password" type="password" autocomplete="current-password" />
            </label>
          </div>
          <div class="cta-row">
            <button class="button primary" id="sign-in">Sign in</button>
          </div>
          <p class="notice" id="auth-error"></p>
        </section>

        <section id="app-shell" class="admin-shell is-hidden">
          <aside class="admin-sidebar panel-card">
            <h3>Operations</h3>
            <ul id="admin-nav-list" class="admin-nav-list"></ul>
          </aside>
          <section class="admin-workspace">
            <div class="workspace-heading panel-card">
              <h1 id="module-title">Overview</h1>
              <p id="module-subtitle" class="notice"></p>
            </div>
            <div id="module-content" class="workspace-content"></div>
          </section>
        </section>
      </main>
    </div>

    <div id="global-drawer" class="global-drawer is-hidden" role="dialog" aria-modal="true">
      <div class="drawer-card">
        <div class="drawer-header">
          <h3 id="global-drawer-title">Details</h3>
          <button id="global-drawer-close" class="button secondary" type="button">Close</button>
        </div>
        <div id="global-drawer-content" class="drawer-content"></div>
      </div>
    </div>

    <div id="confirm-modal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true">
      <div class="modal-card modal-small">
        <div class="modal-header"><h3 id="confirm-modal-title">Confirm</h3></div>
        <div class="modal-body"><p id="confirm-modal-body">Are you sure?</p></div>
        <div class="cta-row">
          <button id="confirm-modal-cancel" class="button secondary" type="button">Cancel</button>
          <button id="confirm-modal-confirm" class="button primary" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="/admin-config.js?v=20260227a"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/admin/app.js?v=20260227a"></script>
  </body>
</html>
